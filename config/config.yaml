project: nexus-v3
brain:
  # Brain PROPIO de nexus-v3. NO usar NEXUS_BRAIN (pertenece a la instalación previa):
  # son proyectos separados y no deben cruzarse.
  path: ${NEXUS_V3_BRAIN:-./brain}
  # Reservado: capacidades TTL por tier (working/episodic/semantic). El harness
  # usa knowledge_graph + RAG; las tiers las consume el bridge legacy.
  hierarchical_tiers:
    working:
      capacity: 100
      ttl_h: 1
    episodic:
      capacity: 500
      ttl_h: 72
    semantic:
      capacity: 0
      ttl_h: 8760
session:
  db_path: ./data/session.db
  # Base de eventos (event store). Relativa a la raiz del proyecto.
  event_db_path: ./data/event_store.db
  wal: true
  fts: true
  # Debe coincidir con providers.ollama.options.num_ctx. Medido el 2026-10-26: con
  # 32000/8192 desalineados, el harness no compactaba hasta 24000 pero Ollama
  # rechazaba todo request >8192 con 400 "exceeds the available context size",
  # el router lo tomaba como modelo roto y recorria modelos (100-165 s por turno).
  max_tokens: 16384
  compact_threshold: 0.75
  keep_recent: 4
agent_loop:
  max_iterations: 25
  max_tokens_per_turn: 8192   # reservado: cap por turno (el cap real es agent_loop.budget)
  error_policy:
    retry: 3
    replan: 2
  # Anti doom-loop: avisos y corte por repeticion exacta / fallos consecutivos.
  anti_loop:
    repeat_warn: [3, 5]
    repeat_stop: 8
    failures_warn: 3
    failures_stop: 6
    # Misma herramienta con argumentos DISTINTOS (ej: leer 9 archivos de a uno):
    # a las 5 se inyecta un recordatorio para cambiar de estrategia; a las 10 se corta.
    tool_warn: 5
    tool_stop: 10
  heartbeat_ms: 2000
  # assisted = las tools mutantes piden aprobacion; auto = se aplican solas.
  auto_apply: assisted
  # Presupuesto del run (IterationBudget). Si falta, se usan estos mismos valores.
  budget:
    max_iterations: 25
    max_tokens: 32000
    max_wall_ms: 900000
    max_tool_calls: 60
approval:
  # auto     = no pide humano (solo hard-deny de secretos/comandos catastroficos)
  # assisted = pide por acciones sensibles + MCP sin allowlist (default)
  # strict   = pide por toda tool mutante / no clasificada como lectura
  # never    = fail-closed sin UI (subagentes y servidor MCP entrante)
  mode: assisted
  timeout_s: 120
  # MCP de solo lectura: server/tool con wildcards. El resto pide aprobacion.
  mcp_read_only:
    - brave-search/*
    - parallel-search/*
    - context7/*
    - mcp-local-rag/*
    - rea/*
    - github/get_*
    - github/list_*
    - github/search_*
    - hindsight/recall
    - hindsight/search
    - nexus-sovereign/read_*
    - nexus-sovereign/list_*
    - nexus-sovereign/search_*
    - nexus-sovereign/brain_recall
    - serena/find_*
    - serena/search_*
  # Patrones tool:action que NINGUN grant puede aprobar.
  hard_deny: []
guard:
  # Guardrail de secuencia (ToolShield): el actor NO decide su propio riesgo.
  # heuristic = solo patrones; auto = heuristic + LLM barato si la secuencia es
  # sospechosa (MEDIUM); llm = siempre consulta.
  sequence:
    enabled: true
    mode: auto
    window: 20
    repeat_medium: 3
    failure_streak_medium: 2
    timeout_s: 2.0
    model_hint: simple
    # Politica formal declarativa. Se evalua antes de la heuristica: deny/high
    # gana sobre allow, y allow solo aplica si ninguna regla mas severa matchea.
    policy:
      enabled: true
      rules:
      - id: deny-rm-root
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\brm\s+-rf\s+(?:/|~|\$home|\$env:userprofile)(?:\s|$)'
        reason: borrado recursivo de raiz/home
      - id: deny-disk-boot
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\b(?:mkfs|diskpart|bcdedit|shutdown|reboot)\b|\bformat\s+[a-z]:'
        reason: operacion de disco/arranque irreversible
      - id: deny-force-history
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\bgit\s+push\b[^\n]*(?:--force(?:-with-lease)?|-f)(?:\s|$)|\bgit\s+reset\s+--hard\b'
        reason: reescritura destructiva del historial
      - id: deny-pipe-shell
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\b(?:curl|wget)\b[^\n]*\|\s*(?:ba|z|k)?sh\b'
        reason: descarga y ejecucion de shell sin revision
      - id: medium-secrets
        action: medium
        tools: ['*']
        pattern: '(?i)(?:^|[\s"'']|[\\/])\.env(?:[\s"'']|[\\/]|$)|\.(?:key|pem|pfx|p12)(?:[\s"'']|$)|\b(?:credentials|secrets?|id_rsa|id_ed25519)\b'
        reason: toca secretos o credenciales
      - id: medium-irreversible
        action: medium
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\b(?:git\s+clean\b[^\n]*-[a-z]*f|docker\s+(?:system\s+)?prune\b|kubectl\s+delete\b|terraform\s+(?:apply|destroy)\b|(?:npm|pnpm|yarn)\s+publish\b|twine\s+upload\b|gh\s+release\s+create\b|docker\s+push\b|aws\b[^\n]*\bdelete-|gcloud\b[^\n]*\bdelete\b)'
        reason: comando sensible o irreversible
      - id: allow-readonly
        action: allow
        tools: [exec, pty_exec]
        pattern: '(?i)^\s*(?:git\s+(?:status|diff|log|show|branch|remote)\b|dir\b|type\b|where\b|pwd\b|echo\b|python\s+-m\s+pytest\b)'
        reason: lectura/verificacion explicita
scope:
  allowed_roots:
  - .
  deny_patterns:
  - '**/.env'
  - '**/*.key'
  - '**/brain/*.db-shm'
  - '**/brain/*.db-wal'
  deny_patterns_full: []
  max_read_bytes: 1048576
  allow_network: true
  allow_mutating_without_confirm: false
  # Opt-in: las tools mutantes exigen confirm=true en los args.
  require_confirm_mutating: false
  permission: full
compaction:
  layers:
  - snip
  - micro
  - budget
  - summary
  snip:
    keep_recent: 4
  micro:
    # Resultados de tools que NUNCA se colapsan (contexto vivo del turno).
    keep_recent: 3
    placeholder: '[tool_result collapsed — see ./data/spill/]'
  budget:
    max_tool_result_chars: 2000
    persist_dir: ./data/spill
  summary:
    model_hint: simple
    # Presupuesto dinamico: max(min_tokens, limit*ratio), techo max_tokens.
    min_tokens: 2000
    ratio: 0.20
    max_tokens: 12000
    # Techo del material enviado al summarizer.
    # Evita overflowear al modelo barato cuando el historial es enorme.
    input_max_tokens: 24000
    # No re-resumir si hubo poco progreso desde el resumen anterior.
    minimum_progress_messages: 2
    # Tras un fallo del LLM de resumen, no reintentar por 10 min.
    failure_cooldown_s: 600
    handoff_prefix: '[handoff] Contexto compactado: el resumen siguiente reemplaza el historial previo. No repitas trabajo ya hecho; verifica antes de asumir.'
  prune:
    # Poda cabeza+cola de resultados de tools viejos antes de cada llamada LLM.
    enabled: true
    keep_recent: 3
    max_tool_result_chars: 4000
providers:
  ollama:
    base_url: http://localhost:11434
    timeout_s: 300
    # Velocidad local: mantiene el modelo cargado entre requests (evita recarga).
    keep_alive: 30m
    # Opciones de generacion Ollama (num_ctx, temperature, num_predict...).
    # num_ctx es la ventana REAL del modelo: si queda por debajo de
    # session.max_tokens, Ollama responde 400 "exceeds the available context size"
    # y el turno se cae. Medido el 2026-10-26 en la RTX 3060: 16384 -> 7,3 GB.
    options:
      num_ctx: 16384
    embed_url: http://localhost:11434
    models:
    - nexus-director-v6
    - qwen3.5-9b
    - ornith-9b
    - qwen3-vl-8b
    - qwen2.5vl:7b
    - qwen2.5-coder:7b
    - deepseek-r1:8b
    - janus-pro-7b
    - nemotron-3-nano:4b
    - gemma4
    - nomic-embed-text
  cloud:
    base_url: https://opencode.ai/zen
    api_key: ${OPENCODE_API_KEY}
    auth_style: bearer
    # Zen FREE solo responde dentro de OpenCode (FreeTierError 403 desde el server de
    # nexus-v3) -> deshabilitado + sin auto-discovery para no perder un intento por turno.
    auto_discover: false
    # P3: strict tool schemas (OpenAI) -> tool calls validos al 1er intento (menos reintentos).
    # Opt-in: algunos endpoints OpenAI-compatibles no soportan strict.
    strict_tools: false
    models: []
    enabled: false
  # CLIs de agentes como proveedores "consultores": responden, no usan nuestras
  # tools (el router los saltea cuando el turno necesita herramientas).
  # Apagados por defecto: cada uno necesita su propio login y su cuota.
  #   claude   -> claude -p --output-format json      (respeta ANTHROPIC_BASE_URL)
  #   codex    -> codex exec --json                   (respeta ~/.codex)
  #   opencode -> opencode run --format json          (respeta tu config de opencode)
  # Para habilitar: enabled: true. Si el binario no esta o no tiene sesion, el
  # provider queda offline con el motivo exacto (no reintenta por 300 s).
  cli:
    opencode:
      enabled: false
      flavor: opencode
      timeout_s: 180
      # model: provider/model        # opcional -> se pasa con -m
      # cwd: .                       # default: directorio descartable
    claude:
      enabled: false
      flavor: claude
      timeout_s: 180
      # permission_mode: plan        # consultor: no edita archivos
    codex:
      enabled: false
      flavor: codex
      timeout_s: 180
      sandbox: read-only
router:
  # PRIORIDAD: Ollama LOCAL SIEMPRE primero. El cloud esta deshabilitado; si se
  # re-habilita, agregarlo a fallback_order como respaldo (nunca antes que ollama).
  strategy: tier
  vram_budget_gb: 0
  prefer_speed: false
  fallback_order:
  - ollama
  # Modelos preferidos por encima del mapeo por gema. Motivo medido (2026-10-26):
  # cambiar de modelo en Ollama cuesta ~45 s de recarga en frio (gemma4 45,4 s,
  # nemotron-3-nano:4b 49,8 s con un prompt de 2 palabras). Un multimodal cubre
  # texto + vision, asi que las gemas conservan su system prompt pero comparten
  # modelo y no hay saltos. El orden es prioridad; si el primero no esta instalado
  # se usa el siguiente. Lista vacia = vuelve al modelo propio de cada gema.
  prefer_models:
  - qwen3-vl-8b
  - qwen2.5vl:7b
hooks:
  phases:
  - pre_tool_use
  - post_tool_use
  - on_error
  - on_compact
  - session_start
  - session_end
  security_gate: true
  # Hooks por archivo: scripts en .nexus/hooks/<fase>/ o
  # .nexus/hooks/<fase>.py. Reciben el payload JSON por stdin; exit 2 bloquea.
  # Si el directorio no existe, no se ejecuta nada.
  files:
    enabled: true
    dir: .nexus/hooks
    timeout_s: 10
    # true = un hook que falla/timeout tambien bloquea (fail-closed).
    fail_closed: false
checkpoints:
  git:
    # Checkpoints globales en un repo sombra (incluye untracked, no toca el
    # repo del usuario). Herramientas: checkpoint_create/list/diff/restore.
    enabled: true
    # Crear uno antes de apply_patch (multi-archivo). Best-effort.
    auto_before_apply_patch: true
reminders:
  min_every_s: 300
  max_active: 50
repl:
  # Kernel de Python persistente para la tool `repl` (estado entre llamadas:
  # imports y variables sobreviven). Corre con los permisos del usuario, igual
  # que `exec`; apagalo si preferis que el modelo use solo scripts sueltos.
  enabled: true
  # Segundos que puede tardar una celda antes de matar el kernel (el estado se
  # pierde y se avisa; la proxima celda arranca limpia).
  timeout_s: 30
  # Kernel ocioso: se apaga solo despues de estos segundos sin uso.
  idle_s: 1800
formatters:
  # Formatear el archivo despues de escribir/editarlo (`src/core/formatters.py`):
  # el diff queda sin ruido y la proxima edicion encuentra el texto exacto.
  # Corre por argv (nunca shell), nunca lanza y no bloquea el turno.
  enabled: true
  # Techo por archivo; si se pasa, se avisa y el archivo queda como estaba.
  timeout_s: 20
  # Comando explicito por extension. Si declara una extension y el ejecutable no
  # existe, el resultado es `error` (no se cae a otro formateador). Ejemplo:
  #   ".py": [".venv-ft314/Scripts/ruff.exe", "format", "{file}"]
  #   ".ts": ["node_modules/.bin/prettier", "--write", "{file}"]
  # Sin `{file}` el archivo se agrega al final, como un CLI normal.
  commands: {}
skills:
  roots:
  - ./data/skills
  # Suma ./skills y ./data/skills al final (true). En tests se apaga para aislar.
  include_default_roots: true
  watch: false
memory:
  agent_write_enabled: true
  learn_min_chars: 12
  # Extraccion automatica de hechos duraderos al terminar cada turno. Usa el
  # provider que resuelva el router (local o cloud); sin provider queda el
  # fallback regex. Portable: no asume hardware ni modelo concreto.
  auto_extract:
    enabled: true
    # Mensajes recientes que ve el extractor (ventana de contexto).
    window: 8
    # Tope de hechos nuevos por turno (evita saturar la memoria).
    max_facts: 5
  # Reservado: persistencia automatica de insights (el ciclo actual registra
  # telemetria en learning; la destilacion es explicita via /api/dream/run).
  auto_insight_persist: true
  # Inyeccion automatica del grafo en el prompt antes de cada turno (no depende
  # de que el modelo decida llamar recall). Presupuesto y filtro anti-ruido.
  inject:
    enabled: true
    limit: 3
    max_terms: 10
    min_terms: 2
    min_matches: 2
    max_chars: 2400
    snippet_chars: 320
    # Rerank semantico opcional: auto intenta embeddings locales y cae a lexico
    # sin romper el turno; force falla si no hay embeddings; off lo desactiva.
    rerank: auto
    # Los embeddings tardan 30-170 ms en caliente, pero si Ollama esta ocupado con el
    # modelo de chat la llamada se encola y el turno paga el timeout entero (2 s
    # medidos el 2026-10-26). 800 ms alcanza y acota el peor caso.
    rerank_timeout_ms: 800
    rerank_candidates: 8
assignment:
  overrides: {}
learning:
  # ANTES de compactar una sesion, destilar lo realizado con el usuario al grafo
  # (peticiones, herramientas, resultados, errores) -> no perder conocimiento y
  # liberar contexto. El saber de todas las sesiones queda buscable con recall.
  distill_on_compact: true
  # Enriquecer el digest con un LLM: el MODELO se elige por CAPACIDAD segun lo
  # instalado en ESTA pc (nada hardcodeado). Si falla, queda el digest determinista.
  distill_llm: true
  distill_model: ""   # override opcional; vacio = auto por capacidad (fast/general)
  # Freno del destilado por compactacion: el hook corre cada vez que se compacta y sin
  # esto se repetia el mismo trabajo (LLM + embeddings) en cada iteracion del loop.
  distill_min_interval_s: 180
  # Red de seguridad: al cerrar una sesion (o al arrancar el server) destilar las
  # sesiones con turnos que nunca compactaron, para no perder conocimiento.
  distill_on_session_end: true

# Rendimiento: aprovecha el Python free-threaded (sin GIL) para multithreading real.
concurrency:
  enabled: true
  # Ejecuta en paralelo las herramientas de SOLO LECTURA de un mismo turno.
  parallel_tools: true
  # 0 = auto (free-threaded: nucleos-1; con GIL: min(8,nucleos)).
  max_threads: 0
voice:
  stt_endpoint: http://127.0.0.1:8789
  stt_timeout_s: 30
  stt_retries: 2
  language: es
  vad_frame_ms: 30
  vad_threshold: 0.02
  vad_pre_roll_ms: 400
  vad_hangover_ms: 300
  vad_min_speech_ms: 250
  tts_endpoint: http://127.0.0.1:4123
updates:
  # URL (http/https) o ruta al manifiesto. Vacio = chequeo deshabilitado.
  # Apunta al asset del ultimo release: la URL no cambia entre versiones.
  # Sirve para COMPARAR archivos; la actualizacion real va por git (abajo).
  manifest_url: "https://github.com/cjtemer-kaos/nexus-v3/releases/latest/download/updates-manifest.json"
  timeout_s: 10
  # Deteccion y planificacion por manifiesto: no descarga ni reemplaza archivos.
  auto_apply: false

  # ---- Auto-actualizacion por git (src/core/self_update.py) ----
  # La app se actualiza sola al abrirse: pull --ff-only ANTES de arrancar el
  # backend, y recompila ui/dist o electron/dist si cambio algo de eso (los
  # cambios de UI NO viajan en git: ui/dist es artefacto, se reconstruye aca).
  # Si el arbol tiene cambios locales o hay commits sin publicar, NO toca nada
  # (podria ser trabajo tuyo) y sigue con la version que ya esta.
  # Si el pull entra pero el build de la UI no sale (falta npm o node_modules,
  # error de TS), queda marcado como "stale": no se reporta como actualizado y
  # la ventana sigue con el bundle viejo hasta que se compile. Estado en
  # data/self_update.log y en Ajustes -> Actualizaciones.
  auto: true
  apply_on_start: true
  git_remote: origin
  git_branch: ""            # vacio = la rama actual (master)
  check_interval_s: 21600   # mientras corre, avisa (banner) cada 6 h si hay algo nuevo
  build_on_update: true
  fetch_timeout_s: 25
  pull_timeout_s: 180
  build_timeout_s: 300
