project: nexus-v3
brain:
  # Brain PROPIO de nexus-v3. NO usar NEXUS_BRAIN (pertenece a supernexus-v2):
  # son proyectos separados y no deben cruzarse.
  path: ${NEXUS_V3_BRAIN:-./brain}
  hierarchical_tiers:
    working:
      capacity: 100
      ttl_h: 1
    episodic:
      capacity: 500
      ttl_h: 72
    semantic:
      capacity: 0
      ttl_h: 8760
session:
  db_path: ./data/session.db
  wal: true
  fts: true
  max_tokens: 32000
  compact_threshold: 0.75
  keep_recent: 4
agent_loop:
  max_iterations: 25
  max_tokens_per_turn: 8192
  error_policy:
    retry: 3
    replan: 2
  heartbeat_ms: 2000
scope:
  allowed_roots:
  - .
  deny_patterns:
  - '**/.env'
  - '**/*.key'
  - '**/brain/*.db-shm'
  - '**/brain/*.db-wal'
  deny_patterns_full: []
  max_read_bytes: 1048576
  allow_network: true
  allow_mutating_without_confirm: false
  permission: workspace_write
compaction:
  layers:
  - snip
  - micro
  - budget
  - summary
  snip:
    keep_recent: 4
  micro:
    placeholder: '[tool_result collapsed — see ./data/spill/]'
  budget:
    max_tool_result_chars: 2000
    persist_dir: ./data/spill
  summary:
    model_hint: simple
    max_summary_tokens: 800
providers:
  ollama:
    base_url: http://localhost:11434
    timeout_s: 300
    # Velocidad local: mantiene el modelo cargado entre requests (evita recarga).
    keep_alive: 30m
    # Opciones de generacion Ollama (num_ctx, temperature, num_predict...).
    options:
      num_ctx: 8192
    embed_url: http://localhost:11434
    models:
    - nexus-director-v6
    - qwen3.5-9b
    - ornith-9b
    - qwen3-vl-8b
    - qwen2.5-coder:7b
    - deepseek-r1:8b
    - janus-pro-7b
    - nemotron-3-nano:4b
    - gemma4
    - nomic-embed-text
  cloud:
    base_url: https://opencode.ai/zen
    api_key: ${OPENCODE_API_KEY}
    auth_style: bearer
    # Zen FREE solo responde dentro de OpenCode (FreeTierError 403 desde el server de
    # nexus-v3) -> deshabilitado + sin auto-discovery para no perder un intento por turno.
    auto_discover: false
    # P3: strict tool schemas (OpenAI) -> tool calls validos al 1er intento (menos reintentos).
    # Opt-in: algunos endpoints OpenAI-compatibles no soportan strict.
    strict_tools: false
    models: []
    enabled: false
router:
  # PRIORIDAD: Ollama LOCAL SIEMPRE primero. El cloud esta deshabilitado; si se
  # re-habilita, agregarlo a fallback_order como respaldo (nunca antes que ollama).
  strategy: tier
  vram_budget_gb: 0
  prefer_speed: false
  fallback_order:
  - ollama
hooks:
  phases:
  - pre_tool_use
  - post_tool_use
  - on_error
  - on_compact
  - session_start
  - session_end
  security_gate: true
reminders:
  min_every_s: 300
  max_active: 50
skills:
  roots:
  - ./data/skills
  watch: false
memory:
  agent_write_enabled: true
  learn_min_chars: 12
  auto_insight_persist: true
assignment:
  overrides: {}
learning:
  # ANTES de compactar una sesion, destilar lo realizado con el usuario al grafo
  # (peticiones, herramientas, resultados, errores) -> no perder conocimiento y
  # liberar contexto. El saber de todas las sesiones queda buscable con recall.
  distill_on_compact: true
  # Enriquecer el digest con un LLM: el MODELO se elige por CAPACIDAD segun lo
  # instalado en ESTA pc (nada hardcodeado). Si falla, queda el digest determinista.
  distill_llm: true
  distill_model: ""   # override opcional; vacio = auto por capacidad (fast/general)
  # Red de seguridad: al cerrar una sesion (o al arrancar el server) destilar las
  # sesiones con turnos que nunca compactaron, para no perder conocimiento.
  distill_on_session_end: true

# Rendimiento: aprovecha el Python free-threaded (sin GIL) para multithreading real.
concurrency:
  enabled: true
  # Ejecuta en paralelo las herramientas de SOLO LECTURA de un mismo turno.
  parallel_tools: true
  # 0 = auto (free-threaded: nucleos-1; con GIL: min(8,nucleos)).
  max_threads: 0
voice:
  stt_endpoint: http://127.0.0.1:8789
  stt_timeout_s: 30
  stt_retries: 2
  language: es
  vad_frame_ms: 30
  vad_threshold: 0.02
  vad_pre_roll_ms: 400
  vad_hangover_ms: 300
  vad_min_speech_ms: 250
  tts_endpoint: http://127.0.0.1:4123
