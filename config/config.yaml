project: nexus-v3
brain:
  path: ${NEXUS_BRAIN:-./brain}
  hierarchical_tiers:
    working:
      capacity: 100
      ttl_h: 1
    episodic:
      capacity: 500
      ttl_h: 72
    semantic:
      capacity: 0
      ttl_h: 8760
session:
  db_path: ./data/session.db
  wal: true
  fts: true
  max_tokens: 32000
  compact_threshold: 0.75
  keep_recent: 4
agent_loop:
  max_iterations: 25
  max_tokens_per_turn: 8192
  error_policy:
    retry: 3
    replan: 2
  heartbeat_ms: 2000
scope:
  allowed_roots:
  - ./workspace
  - ./data
  deny_patterns:
  - '**/.env'
  - '**/*.key'
  - '**/brain/*.db-shm'
  - '**/brain/*.db-wal'
  max_read_bytes: 1048576
  allow_network: true  # web_fetch harness parity (permission read_only still blocks writes)
  allow_mutating_without_confirm: false
  permission: workspace_write  # read_only | workspace_write | full (harness parity)
compaction:
  layers:
  - snip
  - micro
  - budget
  - summary
  snip:
    keep_recent: 4
  micro:
    placeholder: '[tool_result collapsed — see ./data/spill/]'
  budget:
    max_tool_result_chars: 2000
    persist_dir: ./data/spill
  summary:
    model_hint: simple
    max_summary_tokens: 800
providers:
  ollama:
    # base_url se puede sobre-escribir con la env OLLAMA_HOST (autodeteccion).
    base_url: http://localhost:11434
    timeout_s: 300
    # Embeddings (OpenAI-compat de Ollama): embed() postea a {base}/v1/embeddings
    embed_url: http://localhost:11434
    # Lista de PREFERENCIA: en el arranque, environment.adapt_models() la
    # intersecta con los modelos reales de ESTA PC (si no hay match, adopta
    # los instalados). Portabilidad: copiar a otra PC con otros modelos funciona.
    models:
    - nexus-director-v6
    - qwen3.5-9b
    - qwen3-vl-8b
    - qwen2.5-coder:7b
    - deepseek-r1:8b
    - janus-pro-7b
    - nemotron-3-nano:4b
    - gemma4
    - nomic-embed-text
  # NOTA: llama.cpp DESCARTADO (2026-09-28) — vendor/ queda sin uso, todo via Ollama.
  # El proveedor llamacpp se elimino; si lo re-agregas, autostart es opt-in explicito.
  cloud:
    base_url: https://opencode.ai/zen
    api_key: ${OPENCODE_API_KEY}
    auth_style: bearer
    auto_discover: true  # detecta gratis vivos (/v1/models → *free) cada 5 min, persiste en data/cloud_free_cache.json
    models:
    # Solo space-bunny-free responde 200 (2026-09-28); nemotron/mimo/muse/jev/ling/longcat
    # estan gated con 403 por plan en Zen. auto_discover + probe filtra 403.
    - space-bunny-free
    enabled: true
router:
  strategy: thompson
  # 0 = auto-detectar VRAM de la PC (nvidia-smi) o RAM/4 sin GPU. Fijalo si lo necesitas.
  vram_budget_gb: 0
  prefer_speed: false
  fallback_order:
  - ollama
  - cloud
hooks:
  phases:
  - pre_tool_use
  - post_tool_use
  - on_error
  - on_compact
  - session_start
  - session_end
  security_gate: true
