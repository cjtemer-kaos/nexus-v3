project: nexus-v3
brain:
  # Brain PROPIO de nexus-v3. NO usar NEXUS_BRAIN (pertenece a supernexus-v2):
  # son proyectos separados y no deben cruzarse.
  path: ${NEXUS_V3_BRAIN:-./brain}
  # Reservado: capacidades TTL por tier (working/episodic/semantic). El harness
  # usa knowledge_graph + RAG; las tiers las consume el bridge legacy.
  hierarchical_tiers:
    working:
      capacity: 100
      ttl_h: 1
    episodic:
      capacity: 500
      ttl_h: 72
    semantic:
      capacity: 0
      ttl_h: 8760
session:
  db_path: ./data/session.db
  # Base de eventos (event store). Relativa a la raiz del proyecto.
  event_db_path: ./data/event_store.db
  wal: true
  fts: true
  max_tokens: 32000
  compact_threshold: 0.75
  keep_recent: 4
agent_loop:
  max_iterations: 25
  max_tokens_per_turn: 8192   # reservado: cap por turno (el cap real es agent_loop.budget)
  error_policy:
    retry: 3
    replan: 2
  # Anti doom-loop: avisos y corte por repeticion exacta / fallos consecutivos.
  anti_loop:
    repeat_warn: [3, 5]
    repeat_stop: 8
    failures_warn: 3
    failures_stop: 6
  heartbeat_ms: 2000
  # assisted = las tools mutantes piden aprobacion; auto = se aplican solas.
  auto_apply: assisted
  # Presupuesto del run (IterationBudget). Si falta, se usan estos mismos valores.
  budget:
    max_iterations: 25
    max_tokens: 32000
    max_wall_ms: 900000
    max_tool_calls: 60
approval:
  # auto     = no pide humano (solo hard-deny de secretos/comandos catastroficos)
  # assisted = pide por acciones sensibles + MCP sin allowlist (default)
  # strict   = pide por toda tool mutante / no clasificada como lectura
  # never    = fail-closed sin UI (subagentes y servidor MCP entrante)
  mode: assisted
  timeout_s: 120
  # MCP de solo lectura: server/tool con wildcards. El resto pide aprobacion.
  mcp_read_only:
    - brave-search/*
    - parallel-search/*
    - context7/*
    - mcp-local-rag/*
    - rea/*
    - github/get_*
    - github/list_*
    - github/search_*
    - hindsight/recall
    - hindsight/search
    - nexus-sovereign/read_*
    - nexus-sovereign/list_*
    - nexus-sovereign/search_*
    - nexus-sovereign/brain_recall
    - serena/find_*
    - serena/search_*
  # Patrones tool:action que NINGUN grant puede aprobar.
  hard_deny: []
guard:
  # Guardrail de secuencia (ToolShield): el actor NO decide su propio riesgo.
  # heuristic = solo patrones; auto = heuristic + LLM barato si la secuencia es
  # sospechosa (MEDIUM); llm = siempre consulta.
  sequence:
    enabled: true
    mode: auto
    window: 20
    repeat_medium: 3
    failure_streak_medium: 2
    timeout_s: 2.0
    model_hint: simple
    # Politica formal declarativa. Se evalua antes de la heuristica: deny/high
    # gana sobre allow, y allow solo aplica si ninguna regla mas severa matchea.
    policy:
      enabled: true
      rules:
      - id: deny-rm-root
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\brm\s+-rf\s+(?:/|~|\$home|\$env:userprofile)(?:\s|$)'
        reason: borrado recursivo de raiz/home
      - id: deny-disk-boot
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\b(?:mkfs|diskpart|bcdedit|shutdown|reboot)\b|\bformat\s+[a-z]:'
        reason: operacion de disco/arranque irreversible
      - id: deny-force-history
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\bgit\s+push\b[^\n]*(?:--force(?:-with-lease)?|-f)(?:\s|$)|\bgit\s+reset\s+--hard\b'
        reason: reescritura destructiva del historial
      - id: deny-pipe-shell
        action: deny
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\b(?:curl|wget)\b[^\n]*\|\s*(?:ba|z|k)?sh\b'
        reason: descarga y ejecucion de shell sin revision
      - id: medium-secrets
        action: medium
        tools: ['*']
        pattern: '(?i)(?:^|[\s"'']|[\\/])\.env(?:[\s"'']|[\\/]|$)|\.(?:key|pem|pfx|p12)(?:[\s"'']|$)|\b(?:credentials|secrets?|id_rsa|id_ed25519)\b'
        reason: toca secretos o credenciales
      - id: medium-irreversible
        action: medium
        tools: [exec, pty_exec, job_start]
        pattern: '(?i)\b(?:git\s+clean\b[^\n]*-[a-z]*f|docker\s+(?:system\s+)?prune\b|kubectl\s+delete\b|terraform\s+(?:apply|destroy)\b|(?:npm|pnpm|yarn)\s+publish\b|twine\s+upload\b|gh\s+release\s+create\b|docker\s+push\b|aws\b[^\n]*\bdelete-|gcloud\b[^\n]*\bdelete\b)'
        reason: comando sensible o irreversible
      - id: allow-readonly
        action: allow
        tools: [exec, pty_exec]
        pattern: '(?i)^\s*(?:git\s+(?:status|diff|log|show|branch|remote)\b|dir\b|type\b|where\b|pwd\b|echo\b|python\s+-m\s+pytest\b)'
        reason: lectura/verificacion explicita
scope:
  allowed_roots:
  - .
  deny_patterns:
  - '**/.env'
  - '**/*.key'
  - '**/brain/*.db-shm'
  - '**/brain/*.db-wal'
  deny_patterns_full: []
  max_read_bytes: 1048576
  allow_network: true
  allow_mutating_without_confirm: false
  # Opt-in: las tools mutantes exigen confirm=true en los args.
  require_confirm_mutating: false
  permission: full
compaction:
  layers:
  - snip
  - micro
  - budget
  - summary
  snip:
    keep_recent: 4
  micro:
    # Resultados de tools que NUNCA se colapsan (contexto vivo del turno).
    keep_recent: 3
    placeholder: '[tool_result collapsed — see ./data/spill/]'
  budget:
    max_tool_result_chars: 2000
    persist_dir: ./data/spill
  summary:
    model_hint: simple
    # Presupuesto dinamico: max(min_tokens, limit*ratio), techo max_tokens.
    min_tokens: 2000
    ratio: 0.20
    max_tokens: 12000
    # Techo del material enviado al summarizer (Cline agentic-compaction).
    # Evita overflowear al modelo barato cuando el historial es enorme.
    input_max_tokens: 24000
    # No re-resumir si hubo poco progreso desde el resumen anterior.
    minimum_progress_messages: 2
    # Tras un fallo del LLM de resumen, no reintentar por 10 min.
    failure_cooldown_s: 600
    handoff_prefix: '[handoff] Contexto compactado: el resumen siguiente reemplaza el historial previo. No repitas trabajo ya hecho; verifica antes de asumir.'
  prune:
    # Poda cabeza+cola de resultados de tools viejos antes de cada llamada LLM.
    enabled: true
    keep_recent: 3
    max_tool_result_chars: 4000
providers:
  ollama:
    base_url: http://localhost:11434
    timeout_s: 300
    # Velocidad local: mantiene el modelo cargado entre requests (evita recarga).
    keep_alive: 30m
    # Opciones de generacion Ollama (num_ctx, temperature, num_predict...).
    options:
      num_ctx: 8192
    embed_url: http://localhost:11434
    models:
    - nexus-director-v6
    - qwen3.5-9b
    - ornith-9b
    - qwen3-vl-8b
    - qwen2.5-coder:7b
    - deepseek-r1:8b
    - janus-pro-7b
    - nemotron-3-nano:4b
    - gemma4
    - nomic-embed-text
  cloud:
    base_url: https://opencode.ai/zen
    api_key: ${OPENCODE_API_KEY}
    auth_style: bearer
    # Zen FREE solo responde dentro de OpenCode (FreeTierError 403 desde el server de
    # nexus-v3) -> deshabilitado + sin auto-discovery para no perder un intento por turno.
    auto_discover: false
    # P3: strict tool schemas (OpenAI) -> tool calls validos al 1er intento (menos reintentos).
    # Opt-in: algunos endpoints OpenAI-compatibles no soportan strict.
    strict_tools: false
    models: []
    enabled: false
router:
  # PRIORIDAD: Ollama LOCAL SIEMPRE primero. El cloud esta deshabilitado; si se
  # re-habilita, agregarlo a fallback_order como respaldo (nunca antes que ollama).
  strategy: tier
  vram_budget_gb: 0
  prefer_speed: false
  fallback_order:
  - ollama
hooks:
  phases:
  - pre_tool_use
  - post_tool_use
  - on_error
  - on_compact
  - session_start
  - session_end
  security_gate: true
  # Hooks por archivo (port de Cline): scripts en .nexus/hooks/<fase>/ o
  # .nexus/hooks/<fase>.py. Reciben el payload JSON por stdin; exit 2 bloquea.
  # Si el directorio no existe, no se ejecuta nada.
  files:
    enabled: true
    dir: .nexus/hooks
    timeout_s: 10
    # true = un hook que falla/timeout tambien bloquea (fail-closed).
    fail_closed: false
checkpoints:
  git:
    # Checkpoints globales en un repo sombra (incluye untracked, no toca el
    # repo del usuario). Herramientas: checkpoint_create/list/diff/restore.
    enabled: true
    # Crear uno antes de apply_patch (multi-archivo). Best-effort.
    auto_before_apply_patch: true
reminders:
  min_every_s: 300
  max_active: 50
skills:
  roots:
  - ./data/skills
  watch: false
memory:
  agent_write_enabled: true
  learn_min_chars: 12
  # Extraccion automatica de hechos duraderos al terminar cada turno. Usa el
  # provider que resuelva el router (local o cloud); sin provider queda el
  # fallback regex. Portable: no asume hardware ni modelo concreto.
  auto_extract:
    enabled: true
    # Mensajes recientes que ve el extractor (ventana de contexto).
    window: 8
    # Tope de hechos nuevos por turno (evita saturar la memoria).
    max_facts: 5
  # Reservado: persistencia automatica de insights (el ciclo actual registra
  # telemetria en learning; la destilacion es explicita via /api/dream/run).
  auto_insight_persist: true
  # Inyeccion automatica del grafo en el prompt antes de cada turno (no depende
  # de que el modelo decida llamar recall). Presupuesto y filtro anti-ruido.
  inject:
    enabled: true
    limit: 3
    max_terms: 10
    min_terms: 2
    min_matches: 2
    max_chars: 2400
    snippet_chars: 320
    # Rerank semantico opcional: auto intenta embeddings locales y cae a lexico
    # sin romper el turno; force falla si no hay embeddings; off lo desactiva.
    rerank: auto
    rerank_timeout_ms: 2000
    rerank_candidates: 8
assignment:
  overrides: {}
learning:
  # ANTES de compactar una sesion, destilar lo realizado con el usuario al grafo
  # (peticiones, herramientas, resultados, errores) -> no perder conocimiento y
  # liberar contexto. El saber de todas las sesiones queda buscable con recall.
  distill_on_compact: true
  # Enriquecer el digest con un LLM: el MODELO se elige por CAPACIDAD segun lo
  # instalado en ESTA pc (nada hardcodeado). Si falla, queda el digest determinista.
  distill_llm: true
  distill_model: ""   # override opcional; vacio = auto por capacidad (fast/general)
  # Red de seguridad: al cerrar una sesion (o al arrancar el server) destilar las
  # sesiones con turnos que nunca compactaron, para no perder conocimiento.
  distill_on_session_end: true

# Rendimiento: aprovecha el Python free-threaded (sin GIL) para multithreading real.
concurrency:
  enabled: true
  # Ejecuta en paralelo las herramientas de SOLO LECTURA de un mismo turno.
  parallel_tools: true
  # 0 = auto (free-threaded: nucleos-1; con GIL: min(8,nucleos)).
  max_threads: 0
voice:
  stt_endpoint: http://127.0.0.1:8789
  stt_timeout_s: 30
  stt_retries: 2
  language: es
  vad_frame_ms: 30
  vad_threshold: 0.02
  vad_pre_roll_ms: 400
  vad_hangover_ms: 300
  vad_min_speech_ms: 250
  tts_endpoint: http://127.0.0.1:4123
updates:
  # URL (http/https) o ruta al manifiesto. Vacio = chequeo deshabilitado.
  manifest_url: ""
  timeout_s: 10
  # Deteccion y planificacion solamente: no descarga ni reemplaza archivos.
  auto_apply: false
